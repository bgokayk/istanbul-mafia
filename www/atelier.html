<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gece Vardiyası · Grafik Paketi</title><style>@font-face{font-family:pixel;src:url(fonts/PressStart2P-Regular.ttf)}*{box-sizing:border-box}body{margin:0;background:#14222e;color:#ded1ae;font:14px/1.7 monospace}main{max-width:1080px;margin:auto;padding:40px 24px}h1{font:22px/1.7 pixel}small{color:#8faeb0;letter-spacing:3px}p{color:#b0c1c1}a{color:#dec28a}section{margin:32px 0}#heroes{display:grid;grid-template-columns:repeat(auto-fit,minmax(115px,1fr));gap:12px}.hero{background:#233641;border:1px solid #556b70;text-align:center;padding:18px 8px}canvas{image-rendering:pixelated;max-width:100%}.hero canvas{width:96px;height:128px}.hero b{display:block;font:9px pixel;margin-top:12px}button{background:#29424c;border:1px solid #708f8e;color:#ddd0ac;padding:12px;margin:0 6px 10px 0;cursor:pointer}button[aria-pressed=true]{background:#b29a66;color:#162631}#scene{display:block;width:100%;border:1px solid #7b8f8a}footer{border-top:1px solid #4e666d;padding-top:20px}</style><main><small>İSTANBUL MAFIA / 02</small><h1>GECE VARDİYASI<br>GRAFİK PAKETİ</h1><p>Oyunda kullanılan piksel çizimleri. Karakterler 24 × 32 piksel; dört kare yürüyüş döngüsü. Önizlemeler tam sayı oranında büyütülür.</p><section id="heroes"></section><section><h2>Şehrin yüzleri</h2><div id="maps"></div><canvas id="scene" width="960" height="420"></canvas></section><footer><a href="index.html">Oyunu aç →</a><p>Kaynak çizimler: art-v2.js · PNG paketleri: textures/characters ve textures/tiles</p></footer></main><script src="world-ab.js"></script><script src="art-v2.js"></script><script>
const ids=['kurt','ustura','celik','zarci','amca','baba','abla','sofor'],names=['KURT','USTURA','ÇELİK','ZARCI','AMCA','BABA','ABLA','ŞOFÖR'];let map='kapalicarsi';const nodes=ids.map((id,i)=>{let d=document.createElement('div');d.className='hero';d.innerHTML='<canvas width="48" height="64"></canvas><b>'+names[i]+'</b>';document.querySelector('#heroes').appendChild(d);return d.querySelector('canvas');});
const maps={kapalicarsi:'Kapalıçarşı',uskudar:'Üsküdar',balat:'Balat',besiktas:'Beşiktaş',taksim:'Taksim',eminonu:'Eminönü'};Object.entries(maps).forEach(([id,name])=>{let b=document.createElement('button');b.textContent=name;b.setAttribute('aria-pressed',id===map);b.onclick=()=>{map=id;document.querySelectorAll('#maps button').forEach(x=>x.setAttribute('aria-pressed',x===b));};document.querySelector('#maps').appendChild(b);});
function frame(t){nodes.forEach((c,i)=>{let x=c.getContext('2d');x.clearRect(0,0,48,64);MafiaArt.hero(x,24,60,ids[i],2,1,t,true);});let c=document.querySelector('#scene'),x=c.getContext('2d');MafiaArt.floor(x,0,0,c.width,c.height,map);[[130,85,170,95],[750,85,220,100],[150,330,190,75],[810,345,200,80]].forEach(a=>MafiaArt.prop(x,{x:a[0],y:a[1],w:a[2],h:a[3]},map));MafiaArt.barrel(x,310,95);MafiaArt.pillar(x,{x:650,y:300,r:22},map);ids.forEach((id,i)=>MafiaArt.hero(x,320+i*44,200+(i%2)*35,id,2,i%2?-1:1,t,true));requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script></html>
